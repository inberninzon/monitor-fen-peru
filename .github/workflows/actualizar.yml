# Actualiza los datos todos los días y publica el sitio en GitHub Pages
name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 11,23 * * *"   # 6:00 y 18:00 hora de Lima
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  datos-y-sitio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Pipeline de datos
        run: |
          pip install -r pipeline/requirements.txt
          cd pipeline && python run_all.py

      - name: Guardar datos y caché en el repo
        run: |
          git config user.name "fen-bot"
          git config user.email "fen-bot@users.noreply.github.com"
          git add app/public/data pipeline/cache
          git diff --cached --quiet || git commit -m "Datos FEN $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build del sitio
        run: |
          cd app
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - uses: actions/deploy-pages@v4
